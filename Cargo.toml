[package]
name = "sandbox-lite"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Multi-tenant live preview for Astro sites: one small daemon, no Node.js per tenant, rendering in the visitor's browser"

[dependencies]
astro_codegen = { git = "https://github.com/withastro/compiler-rs", rev = "228b54e8c74915d50ece7a9c317818816b7097e1" }
oxc_allocator = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a" }
oxc_diagnostics = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a" }
oxc_codegen = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a", default-features = false }
oxc_parser = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a", features = ["astro"] }
oxc_semantic = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a" }
oxc_span = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a" }
oxc_transformer = { git = "https://github.com/withastro/oxc", rev = "8bb526fc0c20beb4649b223d3ac39851505caa5a" }

axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-graceful", "service", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
imagesize = "0.15"
grass = { version = "0.13", default-features = false }
globset = "0.4"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

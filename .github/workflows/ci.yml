name: ci
on:
  push:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Every branch push runs; a same-repo pull request would only duplicate it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: node tests/editor-escaping.mjs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: ./target/release/sandbox-lite check examples/starter examples/tailwind examples/react examples/vue examples/svelte
      - name: smoke test the daemon
        run: |
          ./target/release/sandbox-lite --listen 127.0.0.1:4399 --bases examples --no-persist &
          for i in $(seq 50); do curl -sf http://127.0.0.1:4399/health >/dev/null && break; sleep 0.2; done
          curl -sf -X POST -H 'content-type: application/json' -d '{"id":"ci","base":"starter"}' http://127.0.0.1:4399/api/tenants
          curl -sf -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/m/src/pages/index.astro?v=1' | grep -q createComponent
          curl -sf -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/routes.json' | grep -q '"/blog/\[slug\]"'
          curl -sf -H 'Host: ci.localhost' 'http://127.0.0.1:4399/' | grep -q shell.js
          # issue #16: a base reloads at runtime and re-points the tenants on it
          curl -sf -X POST http://127.0.0.1:4399/api/bases/starter/reload | grep -qF '"tenants":["ci"]'
          test 400 = "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"name":"outside","path":"/etc"}' http://127.0.0.1:4399/api/bases)"
          # issue #25: deeply nested source must answer rather than abort the daemon
          python3 -c "print('const x = ' + '['*20000)" > deep.ts
          python3 -c "print('<style>p{color:red}</style><script>console.log(1)</script>' + '<div>'*1000 + 'x' + '</div>'*1000)" > deep.astro
          curl -sf -X PUT --data-binary @deep.ts http://127.0.0.1:4399/api/t/ci/file/src/deep.ts
          curl -sf -X PUT --data-binary @deep.astro http://127.0.0.1:4399/api/t/ci/file/src/deep.astro
          test 500 = "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/m/src/deep.ts?v=1')"
          curl -sf -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/m/src/deep.astro?v=1' | grep -q createComponent
          curl -sf -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/m/src/deep.astro?astro&type=style&index=0' | grep -q __sl_css
          curl -sf -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/m/src/deep.astro?astro&type=script&index=0' | grep -q console.log
          test 200 = "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/health)"
          # issue #63: 64 KiB of repeated headings was ~40 minutes of one core; it must now be a page
          python3 -c "import sys; sys.stdout.write('# a\n' * 16000)" > headings.mdx
          curl -sf -X PUT --data-binary @headings.mdx http://127.0.0.1:4399/api/t/ci/file/src/pages/headings.mdx
          # to a file, not a pipe: the module is megabytes and `grep -q` would close the pipe early
          curl -sf --max-time 60 -H 'Host: ci.localhost' 'http://127.0.0.1:4399/__sl/m/src/pages/headings.mdx?v=1' -o /tmp/headings.js
          grep -q '"a-15999"' /tmp/headings.js
          curl -sf http://127.0.0.1:4399/metrics > /tmp/metrics.txt
          grep -qxF '# TYPE sandbox_lite_tenants gauge' /tmp/metrics.txt
          grep -qxF 'sandbox_lite_tenants 1' /tmp/metrics.txt
          # issue #61: a tenant that will not load must be countable, so the gauge has to exist at zero
          grep -qxF '# TYPE sandbox_lite_tenants_failed gauge' /tmp/metrics.txt
          grep -qxF 'sandbox_lite_tenants_failed 0' /tmp/metrics.txt
          grep -qxF '# TYPE sandbox_lite_cache_hits_total counter' /tmp/metrics.txt
          grep -qxF '# TYPE sandbox_lite_sass_runaway gauge' /tmp/metrics.txt
          grep -qxF 'sandbox_lite_screenshots_running 0' /tmp/metrics.txt
          grep -qxF '# TYPE sandbox_lite_screenshots_busy_total counter' /tmp/metrics.txt
          curl -sf http://127.0.0.1:4399/api/stats | grep -q '"max_per_tenant"'
          grep -qxF '# TYPE sandbox_lite_compile_seconds histogram' /tmp/metrics.txt
          grep -qxF '# TYPE sandbox_lite_compiles_queued gauge' /tmp/metrics.txt
          # issue #63: a compile past its deadline is abandoned, so the count of abandoned threads is reportable
          grep -qxF '# TYPE sandbox_lite_compiles_runaway gauge' /tmp/metrics.txt
          grep -qxF 'sandbox_lite_compiles_runaway 0' /tmp/metrics.txt
          grep -qxF '# TYPE sandbox_lite_compiles_timeouts_total counter' /tmp/metrics.txt
          curl -sf http://127.0.0.1:4399/api/stats \
            | python3 -c "import json,sys; c = json.load(sys.stdin)['compiles']; assert c['runaway'] == 0 and c['timeouts'] == 0, c"
          # issue #47: the permit count is what bounds concurrent compiles, so it must never render as 0
          grep -qE '^sandbox_lite_compiles_limit [1-9][0-9]*$' /tmp/metrics.txt
          grep -qxF 'sandbox_lite_bases{base="starter"} 1' /tmp/metrics.txt
          grep -qE '^sandbox_lite_module_requests_total\{kind="module",status="200"\} [1-9][0-9]*$' /tmp/metrics.txt
          grep -qE '^sandbox_lite_module_requests_total\{kind="module",status="500"\} [1-9][0-9]*$' /tmp/metrics.txt
          grep -qE '^sandbox_lite_module_requests_total\{kind="style",status="200"\} [1-9][0-9]*$' /tmp/metrics.txt
          grep -qE '^sandbox_lite_module_requests_total\{kind="script",status="200"\} [1-9][0-9]*$' /tmp/metrics.txt
          grep -qE '^sandbox_lite_compile_seconds_sum\{kind="module"\} [0-9]+\.[0-9]{6}$' /tmp/metrics.txt
          # the +Inf bucket and _count render the same number; drift between them is the bug worth catching
          test "$(awk -F' ' '/^sandbox_lite_compile_seconds_bucket\{kind="module",le="\+Inf"\}/{print $2}' /tmp/metrics.txt)" \
             = "$(awk -F' ' '/^sandbox_lite_compile_seconds_count\{kind="module"\}/{print $2}' /tmp/metrics.txt)"
      - run: bench/mem.sh 100 4398
      - name: one daemon against a dev server per tenant
        run: bench/vs-astro-dev.sh examples/starter 4396
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
